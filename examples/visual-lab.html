<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owned motion reference laboratory</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#182024;background:#f5f2e9;font:18px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:48px 32px}h1{font-size:72px;line-height:1.05;font-weight:600;letter-spacing:-2px}h2{font-size:32px}button{font:inherit;cursor:pointer;padding:16px 24px;border:1px solid currentColor;background:transparent}button:focus-visible{outline:3px solid #934c2b;outline-offset:5px}#panel{display:none;padding:32px;background:#182024;color:white}#panel.open{display:block}#editorial{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{padding:24px;border-top:2px solid #182024}#horizontal{width:100%;overflow-x:auto;scroll-behavior:auto;margin:40px 0}#track{display:flex;width:max-content;gap:24px;padding:12px}#track>div{width:240px;height:160px;background:#cc7a54;padding:24px;flex:none}#reveal{width:260px;height:120px;background:#283d34;color:white;padding:32px;clip-path:inset(0 70% 0 0);transition:clip-path 280ms cubic-bezier(.2,.7,.2,1)}#reveal:hover,#reveal:focus-visible{clip-path:inset(0 0 0 0)}#magnet{margin:80px;width:200px;height:72px;transition:transform 120ms linear}svg{width:240px;height:80px}#stroke{stroke-dasharray:200;animation:draw 1000ms linear infinite alternate}@keyframes draw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}@media(max-width:600px){main{padding:24px}h1{font-size:42px;letter-spacing:-1px}#editorial{grid-template-columns:1fr;gap:16px}#magnet{margin:32px}}@media(prefers-reduced-motion:reduce){#stroke{animation:none;stroke-dashoffset:0}#magnet,#reveal{transition:none}}
</style><main><header><button id="menu" type="button" aria-expanded="false" aria-controls="panel">Explore navigation</button><nav id="panel" aria-label="Section navigation"><a href="#editorial">Editorial</a> · <a href="#horizontal">Gallery</a></nav><h1 id="heading">Quiet structure.<br>Measured movement.</h1></header>
<section id="editorial"><article><h2>Clarity</h2><p>Original semantic content.</p></article><article><h2>Rhythm</h2><p>Relative layout relationships.</p></article><article><h2>Restraint</h2><p>Motion with a stable alternative.</p></article></section>
<div id="horizontal" tabindex="0" aria-label="Horizontal gallery"><div id="track"><div id="slide">One</div><div>Two</div><div>Three</div><div>Four</div><div>Five</div></div></div>
<div id="reveal" tabindex="0">Reveal a detail</div><button id="magnet" type="button">Pointer response</button><svg viewBox="0 0 240 80" aria-label="Stroke demonstration" role="img"><path id="stroke" d="M20 40H220" fill="none" stroke="currentColor" stroke-width="4"/></svg></main>
<script>
const menu=document.getElementById('menu'),panel=document.getElementById('panel'),magnet=document.getElementById('magnet');menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));panel.classList.toggle('open',open)});document.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.setAttribute('aria-expanded','false');panel.classList.remove('open');menu.focus()}});magnet.addEventListener('pointermove',event=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const bounds=magnet.getBoundingClientRect();magnet.style.transform=`translateX(${(event.clientX-bounds.x-bounds.width/2)*.18}px)`});magnet.addEventListener('pointerleave',()=>magnet.style.transform='none');
</script></html>
