<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Mimicus — Visual intelligence for coding agents</title>
  <desc id="desc">An original drawn wordmark and a sculptural study of a grid, selected visual geometry and a measured motion path. Conceptual artwork, not a product screenshot or third-party website.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f5ff"/><stop offset="1" stop-color="#d8dfff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5369e9"/><stop offset="1" stop-color="#273ca9"/></linearGradient>
    <clipPath id="surface"><path d="M1100 120 1640 188 1574 614 1034 546Z"/></clipPath>
  </defs>
  <rect width="1800" height="720" fill="url(#paper)"/>
  <path d="M1800 0v720H0" fill="none" stroke="#bbc5f4" stroke-width="2"/>
  <!-- Original editable monoline wordmark; no font or external image dependency. -->
